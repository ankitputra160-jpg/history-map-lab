name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project from stage2a.zip
        run: |
          set -euo pipefail
          test -f stage2a.zip
          unzip -q stage2a.zip -d project
          test -f project/settings.gradle.kts
          test -f project/scripts/fetch_leaflet.sh
          ls project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Leaflet 1.9.4 (pinned and hash-verified)
        working-directory: project
        run: bash scripts/fetch_leaflet.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK file
        run: |
          set -euo pipefail
          APK="$(find project/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" HistoryMapLab-debug.apk
          ls -lh HistoryMapLab-debug.apk

      - name: Publish APK as a Release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk HistoryMapLab-debug.apk \
            --target "$GITHUB_SHA" \
            --title "History Map Lab (latest debug APK)" \
            --notes "Debug build from commit $GITHUB_SHA. For personal use only."
          echo "Download link: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-apk/HistoryMapLab-debug.apk"

      - name: Also keep APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HistoryMapLab-debug-apk
          path: HistoryMapLab-debug.apk
          retention-days: 14
